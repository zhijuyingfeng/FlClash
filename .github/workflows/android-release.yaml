name: android release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag; leave empty to build the APK artifact only
        required: false
        default: ''
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            android/core/build.gradle.kts

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Gradle
        run: |
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp "$wrapper/gradlew" android/gradlew
          mkdir -p android/gradle/wrapper
          cp "$wrapper/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/
          chmod +x android/gradlew
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
            if [ -n "$KEYSTORE" ]; then
              echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
              echo "storePassword=${{ secrets.STORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            fi
          } > android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --release --split-per-abi --dart-define=APP_ENV=stable

      - name: Stage release assets
        if: inputs.tag != ''
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          mkdir -p release-assets
          for apk in build/app/outputs/flutter-apk/*.apk; do
            abi="$(basename "$apk" | sed -e 's/^app-//' -e 's/-release\.apk$//')"
            cp "$apk" "release-assets/FlClash-$version-$abi.apk"
          done
          sha256sum release-assets/*.apk > release-assets/sha256sums.txt

      - name: Publish release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "FlClash $TAG" \
            --generate-notes \
            "${args[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/*.apk
          overwrite: true
